name: Deploy to Cloudflare Pages

on:
  push:
    paths:
      - '**.html'
      - 'functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 계획.md에 적어둔 빌드와 동일하다.
      # dist로 빼는 이유: 루트를 그대로 올리면 CLAUDE.md·계획.md까지 공개된다.
      - name: Build
        run: |
          set -euo pipefail
          count=$(ls -1 *.html | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "HTML 파일이 1개가 아닙니다 ($count개). 배포할 파일명을 명시하도록 수정하세요." >&2
            exit 1
          fi
          mkdir -p dist
          cp *.html dist/index.html

      # 기본 브랜치는 프로덕션(main 라벨), 나머지 브랜치는 프리뷰 배포로 올라간다.
      - name: Resolve deployment branch label
        id: label
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "value=main" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.129.1 pages deploy dist \
            --project-name=limen \
            --branch="${{ steps.label.outputs.value }}" \
            --commit-dirty=true
