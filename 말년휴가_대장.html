<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말년휴가 대장</title>
<style>
  :root {
    --color-slate-dark: #141413;
    --color-ivory-medium: #f0eee6;
    --color-ivory-light: #faf9f5;
    --color-cloud-medium: #b0aea5;
    --color-cloud-dark: #87867f;
    --color-stone: #cccbc8;
    --color-slate-medium: #3d3d3a;
    --color-oat-warm: #e3dacc;
    --color-manilla: #f5e3c7;
    --color-clay: #d97757;
    --color-clay-deep: #c6613f;

    --font-serif: 'Anthropic Serif', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-sans: 'Anthropic Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --bg: var(--color-ivory-medium);
    --card: var(--color-ivory-light);
    --feature: var(--color-manilla);
    --panel: var(--color-oat-warm);
    --border: var(--color-stone);
    --text: var(--color-slate-dark);
    --muted: var(--color-cloud-medium);
    --muted-strong: var(--color-cloud-dark);
    --accent: var(--color-clay);
    --accent-deep: var(--color-clay-deep);
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #141413;
      --card: #1c1b19;
      --feature: #2b241c;
      --panel: #232220;
      --border: #3d3d3a;
      --text: #f0eee6;
      --muted: #8f8d86;
      --muted-strong: #a8a69f;
      --accent: #d97757;
      --accent-deep: #e8916f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --card: #1c1b19;
    --feature: #2b241c;
    --panel: #232220;
    --border: #3d3d3a;
    --text: #f0eee6;
    --muted: #8f8d86;
    --muted-strong: #a8a69f;
    --accent: #d97757;
    --accent-deep: #e8916f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }

  h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 12px;
  }

  .sub {
    font-family: var(--font-serif);
    font-size: 16px;
    color: var(--muted-strong);
    line-height: 1.5;
    margin: 0;
    max-width: 46ch;
  }

  /* ---- hero total ---- */
  .hero {
    background: var(--feature);
    border-radius: 24px;
    padding: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .hero-num {
    font-family: var(--font-serif);
    font-size: 68px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero-num span {
    font-size: 24px;
    margin-left: 6px;
    color: var(--muted-strong);
  }

  .hero-breakdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-stat { text-align: right; }
  .hero-stat .n {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 20px;
  }
  .hero-stat .l {
    font-size: 12px;
    color: var(--muted-strong);
  }

  /* ---- groups ---- */
  .group {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--card);
    overflow: hidden;
  }

  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .group-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 600;
  }

  .group-total {
    font-size: 14px;
    color: var(--muted-strong);
  }
  .group-total b { color: var(--text); font-weight: 600; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-of-type { border-bottom: none; }

  .row-main {
    min-width: 0;
  }

  .row-label {
    font-family: var(--font-serif);
    font-size: 18px;
  }

  .row-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .row-bar-fill {
    height: 100%;
    background: var(--muted);
    border-radius: 2px;
    transition: width .25s ease;
  }

  .qty {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .qty button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    font-family: var(--font-sans);
  }
  .qty button:hover { border-color: var(--muted-strong); }
  .qty input {
    width: 44px;
    text-align: center;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text);
    -moz-appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button,
  .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty input:focus { outline: none; }

  .del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    font-family: var(--font-sans);
  }
  .del:hover { color: var(--accent-deep); }

  /* add row */
  .add-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    background: var(--card);
  }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
  }
  .add-row input[type="number"] {
    width: 64px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    text-align: center;
  }
  .add-row select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
  }

  .btn-clay {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px 8px 0 8px;
    padding: 8px 20px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-clay:hover { background: var(--accent-deep); }

  footer {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .reset-link:hover { color: var(--text); }

  .saved-note {
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .hero { flex-direction: column; align-items: flex-start; }
    .row { grid-template-columns: 1fr auto; }
    .row .del { grid-column: 1 / -1; justify-self: end; margin-top: -8px; }
  }

  /* ---- top-level view tabs (대장 / 달력) ---- */
  .view-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .view-tab {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted-strong);
    cursor: pointer;
  }
  .view-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- calendar ---- */
  .cal-subtitle {
    font-size: 13px;
    color: var(--muted-strong);
    margin: 0 0 16px;
  }
  .cal-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .cal-tab {
    padding: 8px 14px;
    border-radius: 8px 8px 0 8px;
    border: 1px solid var(--border);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--card);
    color: var(--muted-strong);
  }
  .cal-tab small { display: block; font-size: 10px; font-weight: 400; opacity: .8; }
  .cal-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .cal-plan { display: none; }
  .cal-plan.active { display: block; }

  .cal-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .cal-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
  }
  .cal-stat-num { font-family: var(--font-serif); font-size: 20px; font-weight: 600; }
  .cal-stat-label { font-size: 10px; color: var(--muted-strong); margin-top: 2px; }

  .cal-months {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .cal-month {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px;
  }
  .cal-month-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 10px;
  }
  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 4px;
  }
  .cal-days-header span {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-weight: 500;
  }
  .cal-days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-day {
    font-family: var(--font-sans);
    font-size: 12px;
    text-align: center;
    padding: 5px 2px;
    border-radius: 8px;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  .cal-d-sun { color: var(--accent-deep); }
  .cal-d-sat { color: var(--muted); }

  .cal-schedule {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px 20px;
    margin-top: 16px;
  }
  .cal-schedule-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .cal-schedule-item {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--muted-strong);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .cal-schedule-item:last-child { border-bottom: none; }
  .cal-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
  }
  .cal-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted-strong);
  }
  .cal-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    .cal-summary { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- D-Day gauge ---- */
  .dday-card {
    background: var(--feature);
    border-radius: 24px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .dday-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .dday-label {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--muted-strong);
    font-weight: 500;
  }
  .dday-num {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 600;
    color: var(--accent-deep);
  }
  .dday-gauge-track {
    height: 8px;
    background: rgba(0,0,0,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .dday-gauge-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .dday-caption {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted-strong);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">전역 D-DAY 대장</p>
    <h1>말년휴가 대장</h1>
    <p class="sub">보유한 휴가·포상·위로·청원 휴가를 항목별로 적어두고, 숫자를 바꾸면 합계가 바로 따라옵니다.</p>
  </header>

  <div class="dday-card">
    <div class="dday-top">
      <span class="dday-label">10/19 첫 휴가까지</span>
      <span class="dday-num" id="ddayNum">D-–</span>
    </div>
    <div class="dday-gauge-track"><div class="dday-gauge-fill" id="ddayFill" style="width:0%"></div></div>
    <div class="dday-caption" id="ddayCaption"></div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" id="tabLedger" onclick="showView('ledger')">대장</button>
    <button class="view-tab" id="tabCalendar" onclick="showView('calendar')">달력</button>
  </div>

  <section id="viewLedger" class="view active">

  <div class="hero">
    <div>
      <div class="hero-num" id="grandTotal">0<span>일</span></div>
    </div>
    <div class="hero-breakdown" id="groupTotals"></div>
  </div>

  <div id="groups"></div>

  <div class="group" style="margin-bottom:0;">
    <div class="group-head">
      <div class="group-title">항목 추가</div>
    </div>
    <div class="add-row">
      <input type="text" id="newLabel" placeholder="이름 (예: 포상휴가)">
      <select id="newGroup"></select>
      <input type="number" id="newQty" placeholder="일" min="0" value="1">
      <button class="btn-clay" id="addBtn">추가</button>
    </div>
  </div>

  <footer>
    <button class="reset-link" id="resetBtn">기본값으로 초기화</button>
    <span class="saved-note" id="savedNote"></span>
  </footer>

  </section>

  <section id="viewCalendar" class="view">
    <p class="cal-subtitle">2026년 · 전역일 12/16(수) · 확정 46일</p>

    <div class="cal-tabs" id="calTabs"></div>
    <div id="calPlans"></div>
  </section>

</div>

<script>
(function () {
  const STORE_KEY = 'leave-ledger-v2';

  const DEFAULT_GROUPS = [
    { id: 'annual', title: '연가', items: [
      { id: 'g1', label: '연가', qty: 23 },
    ]},
    { id: 'reward', title: '포상', items: [
      { id: 'g2', label: '운전', qty: 4 },
      { id: 'g3', label: '뜀걸음', qty: 2 },
      { id: 'g4', label: '야근', qty: 3 },
      { id: 'g5', label: '사격특급', qty: 1 },
      { id: 'g6', label: '중대장', qty: 1 },
      { id: 'g7', label: '모범용사(앱개발)', qty: 3 },
      { id: 'g8', label: '드림', qty: 3 },
    ]},
    { id: 'comfort', title: '위로', items: [
      { id: 'g9', label: '종교', qty: 3 },
      { id: 'g10', label: '시설방문', qty: 1 },
    ]},
    { id: 'petition', title: '청원', items: [
      { id: 'g11', label: '구직', qty: 2 },
    ]},
  ];

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || !parsed.length) return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
      return parsed;
    } catch (e) {
      return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    }
  }

  function save(state) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      const note = document.getElementById('savedNote');
      note.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      clearTimeout(save._t);
      save._t = setTimeout(() => { note.textContent = ''; }, 2500);
    } catch (e) {
      // storage unavailable — state still lives in memory for this session
    }
  }

  let state = load();
  let uidCounter = 1000;
  function uid() { return 'u' + (uidCounter++); }

  const groupsEl = document.getElementById('groups');
  const grandTotalEl = document.getElementById('grandTotal');
  const groupTotalsEl = document.getElementById('groupTotals');
  const newGroupSel = document.getElementById('newGroup');

  function populateGroupSelect() {
    newGroupSel.innerHTML = state.map(g => `<option value="${g.id}">${g.title}</option>`).join('');
  }

  function render() {
    let grand = 0;
    // compute max qty across all items for relative bar widths
    let maxQty = 1;
    state.forEach(g => g.items.forEach(it => { if (it.qty > maxQty) maxQty = it.qty; }));

    groupsEl.innerHTML = state.map(g => {
      const groupTotal = g.items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
      grand += groupTotal;
      const rows = g.items.map(it => {
        const pct = Math.max(4, Math.round((it.qty / maxQty) * 100));
        return `
        <div class="row" data-item="${it.id}" data-group="${g.id}">
          <div class="row-main">
            <div class="row-label">${escapeHtml(it.label)}</div>
            <div class="row-bar-track"><div class="row-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="qty">
            <button data-action="dec">−</button>
            <input type="number" min="0" value="${it.qty}" data-action="set">
            <button data-action="inc">+</button>
          </div>
          <button class="del" data-action="del" title="삭제">✕</button>
        </div>`;
      }).join('');

      return `
      <div class="group" data-group-id="${g.id}">
        <div class="group-head">
          <div class="group-title">${escapeHtml(g.title)}</div>
          <div class="group-total"><b>${groupTotal}</b>일</div>
        </div>
        ${rows}
      </div>`;
    }).join('');

    grandTotalEl.innerHTML = grand + '<span>일</span>';

    groupTotalsEl.innerHTML = state.map(g => {
      const t = g.items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
      return `<div class="hero-stat"><div class="n">${t}</div><div class="l">${escapeHtml(g.title)}</div></div>`;
    }).join('');

    populateGroupSelect();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  groupsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const groupId = row.dataset.group;
    const itemId = row.dataset.item;
    const group = state.find(g => g.id === groupId);
    if (!group) return;
    const item = group.items.find(i => i.id === itemId);
    if (!item) return;

    const action = e.target.dataset.action;
    if (action === 'inc') {
      item.qty = (Number(item.qty) || 0) + 1;
    } else if (action === 'dec') {
      item.qty = Math.max(0, (Number(item.qty) || 0) - 1);
    } else if (action === 'del') {
      group.items = group.items.filter(i => i.id !== itemId);
    } else {
      return;
    }
    save(state);
    render();
  });

  groupsEl.addEventListener('change', (e) => {
    if (e.target.dataset.action !== 'set') return;
    const row = e.target.closest('.row');
    const groupId = row.dataset.group;
    const itemId = row.dataset.item;
    const group = state.find(g => g.id === groupId);
    const item = group && group.items.find(i => i.id === itemId);
    if (!item) return;
    let v = parseInt(e.target.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    item.qty = v;
    save(state);
    render();
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const labelEl = document.getElementById('newLabel');
    const qtyEl = document.getElementById('newQty');
    const label = labelEl.value.trim();
    const qty = Math.max(0, parseInt(qtyEl.value, 10) || 0);
    const groupId = newGroupSel.value;
    if (!label) { labelEl.focus(); return; }
    const group = state.find(g => g.id === groupId);
    if (!group) return;
    group.items.push({ id: uid(), label, qty });
    labelEl.value = '';
    qtyEl.value = 1;
    save(state);
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    state = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    uidCounter = 1000;
    save(state);
    render();
  });

  render();
})();

(function () {
  const TARGET = new Date(2026, 9, 19); // 10/19 (month은 0-index)
  const ANCHOR = new Date(2026, 7, 31); // 8/31 — 게이지 기준 시작점
  const MS_DAY = 86400000;

  function zero(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function update() {
    const now = zero(new Date());
    const t = zero(TARGET);
    const a = zero(ANCHOR);

    const diffDays = Math.round((t - now) / MS_DAY);
    const totalSpan = Math.round((t - a) / MS_DAY);
    const elapsed = Math.min(totalSpan, Math.max(0, Math.round((now - a) / MS_DAY)));
    const pct = totalSpan > 0 ? Math.min(100, Math.max(0, (elapsed / totalSpan) * 100)) : 100;

    const numEl = document.getElementById('ddayNum');
    const fillEl = document.getElementById('ddayFill');
    const capEl = document.getElementById('ddayCaption');

    numEl.textContent = diffDays > 0 ? `D-${diffDays}` : (diffDays === 0 ? 'D-DAY' : `D+${-diffDays}`);
    fillEl.style.width = pct + '%';
    capEl.textContent = diffDays > 0
      ? `8/31부터 ${elapsed}일 경과 · ${Math.round(pct)}%`
      : '첫 휴가 시작!';
  }

  update();
  setInterval(update, 60 * 1000);
})();

  document.getElementById('viewCalendar').classList.toggle('active', name === 'calendar');
  document.getElementById('tabLedger').classList.toggle('active', name === 'ledger');
  document.getElementById('tabCalendar').classList.toggle('active', name === 'calendar');
}

(function () {
  // 훈련 5개 구간 (커버 여부를 자동 집계하기 위해 구간 단위로 관리)
  const trainingBlocks = [
    ['10-19','10-20','10-21','10-22'],
    ['10-26','10-27','10-28','10-29'],
    ['11-16','11-17','11-18','11-19'],
    ['11-23','11-24','11-25','11-26'],
    ['11-30','12-1','12-2','12-3'],
  ];
  const training = new Set(trainingBlocks.flat());
  const COMBAT_TOTAL = 13; // 보유 전투휴무증

  const plans = {
    confirmed: {
      label: '확정 (11+11+12+12)',
      schedule: [
        {r:'1회차', label:'10/19(월)~10/29(목) — 11일'},
        {r:'2회차', label:'11/2(월)~11/12(목) — 11일'},
        {r:'3회차', label:'11/15(일)~11/26(목) — 12일'},
        {r:'4회차', label:'11/30(월)~12/11(금) — 12일'},
      ],
      leaves: {
        '10-19':1,'10-20':1,'10-21':1,'10-22':1,'10-23':1,'10-24':1,'10-25':1,'10-26':1,'10-27':1,'10-28':1,'10-29':1,
        '11-2':2,'11-3':2,'11-4':2,'11-5':2,'11-6':2,'11-7':2,'11-8':2,'11-9':2,'11-10':2,'11-11':2,'11-12':2,
        '11-15':3,'11-16':3,'11-17':3,'11-18':3,'11-19':3,'11-20':3,'11-21':3,'11-22':3,'11-23':3,'11-24':3,'11-25':3,'11-26':3,
        '11-30':4,'12-1':4,'12-2':4,'12-3':4,'12-4':4,'12-5':4,'12-6':4,'12-7':4,'12-8':4,'12-9':4,'12-10':4,'12-11':4,
      },
      combatSet: new Set([]),
      showMonths: [10,11,12],
    },
  };

  const planOrder = ['confirmed'];

  const monthDays = {8:31,9:30,10:31,11:30,12:31};
  const monthNames = {8:'8월',9:'9월',10:'10월',11:'11월',12:'12월'};

  // 회차별 카드 배경/글자색 — 웜톤 팔레트 안에서 5가지로 구분
  const roundBg = ['', '#f2e2d8', '#e6e6d6', '#f3e6c8', '#ecdccd', '#dbe6e4'];
  const roundFg = ['', '#a8542e', '#5f6b3f', '#8a6a1f', '#6b4423', '#3f6b6b'];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildPlan(planId) {
    const plan = plans[planId];
    const container = document.createElement('div');
    container.className = 'cal-plan';
    container.id = planId;

    const totalDays = Object.keys(plan.leaves).length;
    const roundCount = new Set(Object.values(plan.leaves)).size;
    const combatCount = plan.combatSet.size;
    const coveredCount = trainingBlocks.filter(b => b.every(d => plan.leaves[d])).length;

    let html = `<div class="cal-summary">
      <div class="cal-stat"><div class="cal-stat-num">${totalDays}일</div><div class="cal-stat-label">총 소진</div></div>
      <div class="cal-stat"><div class="cal-stat-num">${roundCount}회차</div><div class="cal-stat-label">휴가 횟수</div></div>
      <div class="cal-stat"><div class="cal-stat-num">${combatCount}장</div><div class="cal-stat-label">전투휴무증 (잔여 ${COMBAT_TOTAL - combatCount})</div></div>
      <div class="cal-stat"><div class="cal-stat-num">${coveredCount}/${trainingBlocks.length}</div><div class="cal-stat-label">훈련커버</div></div>
    </div>`;

    html += '<div class="cal-months">';
    plan.showMonths.forEach(m => {
      const days = monthDays[m];
      html += `<div class="cal-month"><div class="cal-month-title">${monthNames[m]} 2026</div>
      <div class="cal-days-header">
        <span class="cal-d-sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div><div class="cal-days-grid">`;
      const firstDay = new Date(2026, m - 1, 1).getDay();
      for (let i = 0; i < firstDay; i++) html += '<div class="cal-day"></div>';
      for (let d = 1; d <= days; d++) {
        const key = `${m}-${d}`;
        const dow = new Date(2026, m - 1, d).getDay();
        const round = plan.leaves[key];
        const isCombat = plan.combatSet.has(key);
        const isTrain = training.has(key);
        const isDischarge = key === '12-16';
        const isSurvey = round === 's';
        let style = ''; let cls = 'cal-day';
        if (isDischarge) {
          style = `background:var(--accent);color:#fff;font-weight:700`;
        } else if (isCombat) {
          style = `background:var(--color-slate-dark);color:var(--color-ivory-light);font-weight:600`;
        } else if (isSurvey) {
          style = `background:var(--feature);color:var(--text);font-weight:600`;
        } else if (round) {
          style = `background:${roundBg[round]};color:${roundFg[round]};font-weight:600`;
        } else if (isTrain) {
          style = `background:var(--panel);color:var(--muted-strong);font-weight:600`;
        } else if (dow === 0) { cls += ' cal-d-sun';
        } else if (dow === 6) { cls += ' cal-d-sat'; }
        html += `<div class="${cls}" style="${style}">${d}</div>`;
      }
      html += '</div></div>';
    });
    html += '</div>';

    html += `<div class="cal-schedule"><div class="cal-schedule-title">일정</div>` +
      plan.schedule.map(s => {
        const bg = s.isCombat ? 'var(--color-slate-dark)' : (s.isSurvey ? 'var(--feature)' : 'var(--panel)');
        const fg = s.isCombat ? 'var(--color-ivory-light)' : 'var(--text)';
        return `<div class="cal-schedule-item">
          <span class="cal-badge" style="background:${bg};color:${fg}">${s.r}</span>
          <span>${escapeHtml(s.label)}</span>
        </div>`;
      }).join('') + '</div>';

    container.innerHTML = html;
    document.getElementById('calPlans').appendChild(container);
  }

  function showPlan(id, el) {
    document.querySelectorAll('.cal-plan').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.cal-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
  }

  const tabsEl = document.getElementById('calTabs');
  if (planOrder.length <= 1) {
    tabsEl.style.display = 'none';
  } else {
    tabsEl.innerHTML = planOrder.map((id, i) =>
      `<button class="cal-tab${i === 0 ? ' active' : ''}" data-plan="${id}">${plans[id].label.replace(' (', '<br><small>(').replace(/\)$/, ')</small>')}</button>`
    ).join('');
    tabsEl.querySelectorAll('.cal-tab').forEach(btn => {
      btn.addEventListener('click', () => showPlan(btn.dataset.plan, btn));
    });
  }

  planOrder.forEach(buildPlan);
  const firstPlanEl = document.getElementById(planOrder[0]);
  if (firstPlanEl) firstPlanEl.classList.add('active');
})();
</script>
