<style>
  :root {
    --color-slate-dark: #141413;
    --color-ivory-medium: #f0eee6;
    --color-ivory-light: #faf9f5;
    --color-cloud-medium: #b0aea5;
    --color-cloud-dark: #87867f;
    --color-stone: #cccbc8;
    --color-slate-medium: #3d3d3a;
    --color-oat-warm: #e3dacc;
    --color-manilla: #f5e3c7;
    --color-clay: #d97757;
    --color-clay-deep: #c6613f;

    --font-serif: 'Anthropic Serif', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-sans: 'Anthropic Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --bg: var(--color-ivory-medium);
    --card: var(--color-ivory-light);
    --feature: var(--color-manilla);
    --panel: var(--color-oat-warm);
    --border: var(--color-stone);
    --text: var(--color-slate-dark);
    --muted: var(--color-cloud-medium);
    --muted-strong: var(--color-cloud-dark);
    --accent: var(--color-clay);
    --accent-deep: var(--color-clay-deep);

    /* 회차 구분 톤 — 웜톤 팔레트 안에서 만든 값 (hex 직접 사용 금지 규약에 따라 토큰화) */
    --round-1-bg: #f2e2d8; --round-1-fg: #a8542e;
    --round-2-bg: #e6e6d6; --round-2-fg: #5f6b3f;
    --round-3-bg: #f3e6c8; --round-3-fg: #8a6a1f;
    --round-4-bg: #ecdccd; --round-4-fg: #6b4423;
    --round-5-bg: #dbe6e4; --round-5-fg: #3f6b6b;

    --gauge-track: rgba(0,0,0,0.08);

    /* 모션 토큰 — duration은 200~500ms 권장 구간, easing은 GSAP류 감속 커브(power3.out)를
       흉내낸 cubic-bezier. --accent-rgb는 클레이 토큰과 같은 색을 alpha 있게 쓰기 위한
       채널값이다(라이트/다크 모두 --accent가 동일한 클레이라 테마별로 나누지 않는다). */
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --dur-fast: 150ms;
    --dur-base: 300ms;
    --dur-slow: 600ms;
    --accent-rgb: 217, 119, 87;
  }

  /* 다크 팔레트 — 중첩 문법을 쓰지 않아 구형 브라우저(삼성 인터넷 포함)에서도 적용된다 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --card: #1c1b19;
      --feature: #2b241c;
      --panel: #232220;
      --border: #3d3d3a;
      --text: #f0eee6;
      --muted: #8f8d86;
      --muted-strong: #a8a69f;
      --accent: #d97757;
      --accent-deep: #e8916f;
      --round-1-bg: #3a2a22; --round-1-fg: #e2a184;
      --round-2-bg: #2c3126; --round-2-fg: #b9c79a;
      --round-3-bg: #3a2f1c; --round-3-fg: #dcc07f;
      --round-4-bg: #33261c; --round-4-fg: #d9a878;
      --round-5-bg: #22302f; --round-5-fg: #8fc0bc;
      --gauge-track: rgba(255,255,255,0.12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --card: #1c1b19;
    --feature: #2b241c;
    --panel: #232220;
    --border: #3d3d3a;
    --text: #f0eee6;
    --muted: #8f8d86;
    --muted-strong: #a8a69f;
    --accent: #d97757;
    --accent-deep: #e8916f;
    --round-1-bg: #3a2a22; --round-1-fg: #e2a184;
    --round-2-bg: #2c3126; --round-2-fg: #b9c79a;
    --round-3-bg: #3a2f1c; --round-3-fg: #dcc07f;
    --round-4-bg: #33261c; --round-4-fg: #d9a878;
    --round-5-bg: #22302f; --round-5-fg: #8fc0bc;
    --gauge-track: rgba(255,255,255,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }

  h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 12px;
  }

  .sub {
    font-family: var(--font-serif);
    font-size: 16px;
    color: var(--muted-strong);
    line-height: 1.5;
    margin: 0;
    max-width: 46ch;
  }

  /* ---- hero total ---- */
  .hero {
    background: var(--feature);
    border-radius: 24px;
    padding: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .hero-num {
    font-family: var(--font-serif);
    font-size: 68px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero-num span {
    font-size: 24px;
    margin-left: 6px;
    color: var(--muted-strong);
  }

  .hero-meta {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted-strong);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hero-meta b { color: var(--text); font-weight: 600; }

  .warn-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--color-ivory-light);
  }

  .hero-breakdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-stat { text-align: right; }
  .hero-stat .n {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 20px;
  }
  .hero-stat .l {
    font-size: 12px;
    color: var(--muted-strong);
  }

  /* ---- groups ---- */
  .group {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--card);
    overflow: hidden;
  }

  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .group-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 600;
  }

  .group-total {
    font-size: 14px;
    color: var(--muted-strong);
  }
  .group-total b { color: var(--text); font-weight: 600; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-of-type { border-bottom: none; }

  .row-main {
    min-width: 0;
  }

  .row-label {
    font-family: var(--font-serif);
    font-size: 18px;
  }

  .row-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .row-bar-fill {
    height: 100%;
    background: var(--muted);
    border-radius: 2px;
    transition: width .25s ease;
  }

  .qty {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .qty button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    font-family: var(--font-sans);
  }
  .qty button:hover { border-color: var(--muted-strong); }
  .qty input {
    width: 44px;
    text-align: center;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text);
    -moz-appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button,
  .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty input:focus { outline: none; }

  .del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    font-family: var(--font-sans);
  }
  .del:hover { color: var(--accent-deep); }

  /* add row */
  .add-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    background: var(--card);
  }
  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
  }
  .add-row input[type="number"] {
    width: 64px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    text-align: center;
  }
  .add-row select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
  }

  .btn-clay {
    background: var(--accent);
    color: var(--color-ivory-light);
    border: none;
    border-radius: 8px 8px 0 8px;
    padding: 8px 20px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-clay:hover { background: var(--accent-deep); }

  footer {
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .footer-left { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .reset-link:hover { color: var(--text); }

  .saved-note {
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .hero { flex-direction: column; align-items: flex-start; }
    .row { grid-template-columns: 1fr auto; }
    .row .del { grid-column: 1 / -1; justify-self: end; margin-top: -8px; }
  }

  /* ---- top-level view tabs (대장 / 달력) ---- */
  .view-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .view-tab {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    margin-right: 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted-strong);
    cursor: pointer;
  }
  .view-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- calendar ---- */
  .cal-subtitle {
    font-size: 13px;
    color: var(--muted-strong);
    margin: 0 0 16px;
  }
  .cal-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .cal-tab {
    padding: 8px 14px;
    border-radius: 8px 8px 0 8px;
    border: 1px solid var(--border);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--card);
    color: var(--muted-strong);
  }
  .cal-tab small { display: block; font-size: 10px; font-weight: 400; opacity: .8; }
  .cal-tab.active {
    background: var(--accent);
    color: var(--color-ivory-light);
    border-color: var(--accent);
  }

  .cal-plan { display: none; }
  .cal-plan.active { display: block; }

  .cal-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .cal-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
  }
  .cal-stat-num { font-family: var(--font-serif); font-size: 20px; font-weight: 600; }
  .cal-stat-label { font-size: 10px; color: var(--muted-strong); margin-top: 2px; }

  .cal-months {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .cal-month {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px;
  }
  .cal-month-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 10px;
  }
  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 4px;
  }
  .cal-days-header span {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-weight: 500;
  }
  .cal-days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-day {
    font-family: var(--font-sans);
    font-size: 12px;
    text-align: center;
    padding: 5px 2px;
    border-radius: 8px;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  .cal-d-sun { color: var(--accent-deep); }
  .cal-d-sat { color: var(--muted); }

  /* 오늘 / 지나간 날 */
  .cal-day.is-past { opacity: .4; }
  .cal-day.is-today {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    font-weight: 700;
  }
  body.record-mode .cal-day.can-record { cursor: pointer; }
  body.record-mode .cal-day.can-record:hover { outline: 2px dashed var(--muted-strong); outline-offset: -2px; }

  .cal-schedule {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px 20px;
    margin-top: 16px;
  }
  .cal-schedule-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .cal-schedule-item {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--muted-strong);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .cal-schedule-item:last-child { border-bottom: none; }
  .cal-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cal-schedule-item.is-done { opacity: .45; }
  .cal-schedule-item .now-tag {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-deep);
    white-space: nowrap;
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
  }
  .cal-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted-strong);
  }
  .cal-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    .cal-summary { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- D-Day gauge ---- */
  .dday-card {
    background: var(--feature);
    border-radius: 24px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .dday-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 12px;
  }
  .dday-label {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--muted-strong);
    font-weight: 500;
  }
  .dday-num {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 600;
    color: var(--accent-deep);
    white-space: nowrap;
  }
  .dday-gauge-track {
    height: 8px;
    background: var(--gauge-track);
    border-radius: 4px;
    overflow: hidden;
  }
  .dday-gauge-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width .4s ease;
  }
  .dday-caption {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted-strong);
  }
  .dday-workdays {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted-strong);
  }
  .dday-workdays b { color: var(--text); font-weight: 700; }

  /* ---- 전역(복무) 게이지 ---- */
  .service-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px 24px;
    margin-bottom: 24px;
  }

  /* ---- 전투휴무증 ---- */
  .combat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px 20px;
    margin-top: 16px;
  }
  .combat-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 12px;
  }
  .combat-title { font-family: var(--font-serif); font-size: 16px; font-weight: 600; }
  .combat-count { font-size: 13px; color: var(--muted-strong); }
  .combat-count b { color: var(--text); font-weight: 700; font-size: 16px; }
  .combat-note { font-size: 12px; color: var(--muted-strong); margin: 10px 0 12px; line-height: 1.5; }
  .combat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text);
  }
  .chip button {
    background: none; border: none; padding: 0;
    color: var(--muted); cursor: pointer; font-size: 12px;
    font-family: var(--font-sans);
  }
  .chip button:hover { color: var(--accent-deep); }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px 8px 0 8px;
    padding: 7px 14px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-outline:hover { border-color: var(--muted-strong); }
  .btn-outline.on { background: var(--accent); border-color: var(--accent); color: var(--color-ivory-light); }

  /* ---- 컴팩트(위젯) 뷰 ---- */
  body.compact-mode .wrap { max-width: 420px; padding: 20px 18px 24px; }
  body.compact-mode header,
  body.compact-mode .view-tabs,
  body.compact-mode #ddayCard,
  body.compact-mode #serviceCard,
  body.compact-mode .view { display: none !important; }
  body.compact-mode #viewCompact { display: block !important; }
  #viewCompact { display: none; }
  .compact-card {
    background: var(--feature);
    border-radius: 24px;
    padding: 22px 24px 20px;
  }
  .compact-label { font-size: 13px; color: var(--muted-strong); font-weight: 500; }
  .compact-num {
    font-family: var(--font-serif);
    font-size: 64px;
    line-height: 1.05;
    font-weight: 600;
    color: var(--accent-deep);
    margin: 2px 0 12px;
  }
  .compact-sub { margin-top: 10px; font-size: 12px; color: var(--muted-strong); }
  .compact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .compact-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 6px;
    text-align: center;
  }
  .compact-cell .n { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
  .compact-cell .l { font-size: 10px; color: var(--muted-strong); margin-top: 2px; }
  .compact-exit {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
  }
  .compact-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .compact-next { margin-top: 4px; font-size: 12px; color: var(--muted-strong); }
  .state-tag {
    display: inline-flex;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--color-ivory-light);
  }
  .state-tag[hidden] { display: none; }

  /* 회차 진행 세그먼트 — 폭은 회차 일수에 비례 */
  .seg-track { display: flex; gap: 3px; margin-top: 6px; }
  .seg { height: 6px; border-radius: 3px; background: var(--gauge-track); overflow: hidden; }
  .seg > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
  .seg-labels { display: flex; gap: 3px; margin-top: 3px; }
  .seg-label { text-align: center; font-size: 10px; color: var(--muted); }
  .seg-label.on { color: var(--accent-deep); font-weight: 700; }

  /* 상태별 색 반전 — 휴가 중 / 전역 임박 */
  .compact-card.st-during { background: var(--accent); color: var(--color-ivory-light); }
  .compact-card.st-during .compact-num { color: var(--color-ivory-light); }
  .compact-card.st-during .compact-label,
  .compact-card.st-during .compact-sub,
  .compact-card.st-during .compact-next,
  .compact-card.st-during .seg-label { color: rgba(255,255,255,.8); }
  .compact-card.st-during .seg-label.on { color: var(--color-ivory-light); }
  .compact-card.st-during .state-tag { background: rgba(255,255,255,.24); color: var(--color-ivory-light); }
  .compact-card.st-during .dday-gauge-track,
  .compact-card.st-during .seg { background: rgba(255,255,255,.28); }
  .compact-card.st-during .dday-gauge-fill,
  .compact-card.st-during .seg > i { background: var(--color-ivory-light); }
  .compact-card.st-during .compact-cell {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.22);
    color: var(--color-ivory-light);
  }
  .compact-card.st-during .compact-cell .l { color: rgba(255,255,255,.75); }

  .compact-card.st-final { background: var(--color-slate-dark); color: var(--color-ivory-light); }
  .compact-card.st-final .compact-num { color: var(--accent); }
  .compact-card.st-final .compact-label,
  .compact-card.st-final .compact-sub,
  .compact-card.st-final .compact-next,
  .compact-card.st-final .seg-label { color: rgba(255,255,255,.7); }
  .compact-card.st-final .seg-label.on { color: var(--accent); }
  .compact-card.st-final .dday-gauge-track,
  .compact-card.st-final .seg { background: rgba(255,255,255,.2); }
  .compact-card.st-final .compact-cell {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.18);
    color: var(--color-ivory-light);
  }
  .compact-card.st-final .compact-cell .l { color: rgba(255,255,255,.66); }

  /* 위젯 전용 베어 모드 — 배경을 비우고 글자만 남긴다 */
  body.bare-mode { background: transparent; }
  body.bare-mode .wrap { max-width: none; padding: 0; }
  body.bare-mode .compact-card { background: transparent; padding: 0; }
  body.bare-mode .compact-card.st-during .compact-num,
  body.bare-mode .compact-card.st-final .compact-num { color: var(--accent-deep); }
  body.bare-mode .compact-card.st-during,
  body.bare-mode .compact-card.st-final { color: var(--text); }
  body.bare-mode .compact-card.st-during .compact-label,
  body.bare-mode .compact-card.st-during .compact-sub,
  body.bare-mode .compact-card.st-during .compact-next,
  body.bare-mode .compact-card.st-final .compact-label,
  body.bare-mode .compact-card.st-final .compact-sub,
  body.bare-mode .compact-card.st-final .compact-next { color: var(--muted-strong); }
  body.bare-mode .compact-card.st-during .dday-gauge-track,
  body.bare-mode .compact-card.st-final .dday-gauge-track,
  body.bare-mode .compact-card.st-during .seg,
  body.bare-mode .compact-card.st-final .seg { background: var(--gauge-track); }
  body.bare-mode .compact-card.st-during .dday-gauge-fill,
  body.bare-mode .compact-card.st-during .seg > i { background: var(--accent); }
  body.bare-mode .compact-num { font-size: 76px; }
  body.bare-mode .compact-cell {
    background: transparent;
    border: none;
    padding: 8px 2px 0;
  }
  body.bare-mode .compact-card.st-during .compact-cell,
  body.bare-mode .compact-card.st-final .compact-cell { background: transparent; color: var(--text); }
  /* 베어 모드에서는 카드 배경이 사라지므로, 상태 배지가 유일한 상태 신호가 된다.
     반투명 흰색 배지는 배경화면 위에서 묻히므로 액센트 배지로 바꾼다. */
  body.bare-mode .compact-card.st-during .state-tag,
  body.bare-mode .compact-card.st-final .state-tag {
    background: var(--accent);
    color: var(--color-ivory-light);
  }
  body.bare-mode .compact-exit { display: none; }
  /* 배경화면 위에 얹히므로 얇은 그림자로 가독성을 확보한다 */
  body.bare-mode .compact-card,
  body.bare-mode .compact-card * { text-shadow: 0 1px 3px rgba(0,0,0,.3); }

  /* ====================================================================
     모션 — 입장(rise/pop) · 탭 전환 · 눌림 피드백 · D-Day 당일 연출
     참고: 마이크로 인터랙션 200~500ms, 진입은 ease-out이 자연스럽다는
     일반적인 모션 디자인 가이드라인 기준으로 duration/easing을 잡았다.
     ==================================================================== */
  @keyframes mlv-rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mlv-pop {
    from { opacity: 0; transform: scale(.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes mlv-pulse-num {
    0%, 100% { text-shadow: 0 0 0 rgba(var(--accent-rgb), 0); }
    50%      { text-shadow: 0 0 24px rgba(var(--accent-rgb), .6); }
  }
  @keyframes mlv-pulse-card {
    0%, 100% { box-shadow: 0 0 0 rgba(var(--accent-rgb), 0); }
    50%      { box-shadow: 0 0 40px rgba(var(--accent-rgb), .28); }
  }

  /* 새로 그려지는 카드류에 입장 애니메이션. innerHTML로 통째로 다시 그려지는
     블록이라 매번 새 DOM 노드가 생기고, 그래서 재렌더할 때마다 자연스럽게
     다시 재생된다 — 값을 바꿨을 때 "반영됐다"는 확인 피드백도 겸한다. */
  .group, .cal-stat, .cal-month, .cal-schedule, .combat-card {
    animation: mlv-rise var(--dur-slow) var(--ease-out) both;
  }
  .chip { animation: mlv-pop var(--dur-base) var(--ease-out) both; }

  /* 대장 ↔ 달력 탭 전환 — display 전환 자체는 즉시 일어나지만(레이아웃 안정성 때문에
     유지), 나타나는 쪽에 살짝 rise를 얹어 하드컷 대신 크로스페이드처럼 보이게 한다 */
  .view.active { animation: mlv-rise var(--dur-slow) var(--ease-out) both; }

  /* 회차 진행 세그먼트 — 순서대로 살짝 늦게 나타나며 차오른다 (stagger) */
  .seg-track .seg { animation: mlv-pop var(--dur-base) var(--ease-out) both; }
  .seg-track .seg:nth-child(1) { animation-delay: 0ms; }
  .seg-track .seg:nth-child(2) { animation-delay: 60ms; }
  .seg-track .seg:nth-child(3) { animation-delay: 120ms; }
  .seg-track .seg:nth-child(4) { animation-delay: 180ms; }
  .seg > i { transition: width var(--dur-slow) var(--ease-out); }

  /* 버튼류 눌림 피드백 — 진짜 눌리는 느낌만 살짝, hover 아님(모바일 웹앱이라 hover는 의미가 적다) */
  .qty button, .btn-clay, .btn-outline, .del, .reset-link, .view-tab, .cal-tab {
    transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .qty button:active, .btn-clay:active, .btn-outline:active, .cal-tab:active {
    transform: scale(.94);
  }

  /* D-Day 당일 전용 연출 — 그날 하루만, JS가 .is-dday-today를 붙인다 */
  .dday-num.is-dday-today { animation: mlv-pulse-num 2.2s ease-in-out infinite; }
  .dday-card.is-dday-today, .service-card.is-dday-today { animation: mlv-pulse-card 2.2s ease-in-out infinite; }
  .compact-num.is-dday-today { animation: mlv-pulse-num 2.2s ease-in-out infinite; }

  /* 전투휴무증 총 보유 수 편집용 인라인 스테퍼 — 기존 .qty와 같은 언어 */
  .combat-total-edit {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .combat-total-edit button {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: var(--radius-sm, 8px);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .combat-total-edit button:active { transform: scale(.9); }
  .combat-total-edit input {
    width: 34px;
    text-align: center;
    border: none;
    background: transparent;
    color: var(--muted-strong);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    -moz-appearance: textfield;
  }
  .combat-total-edit input::-webkit-outer-spin-button,
  .combat-total-edit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .combat-total-edit input:focus { outline: none; color: var(--text); }

  /* 접근성: 움직임을 줄이도록 설정한 사용자에게는 전부 즉시 반영으로 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">전역 D-DAY 대장</p>
    <h1>말년휴가 대장</h1>
    <p class="sub">보유한 휴가·포상·위로·청원 휴가를 항목별로 적어두고, 숫자를 바꾸면 합계가 바로 따라옵니다.</p>
  </header>

  <div class="dday-card" id="ddayCard">

    </div>
    <div class="dday-gauge-track"><div class="dday-gauge-fill" id="svcFill" style="width:0%"></div></div>
    <div class="dday-caption" id="svcCaption"></div>
    <div class="dday-workdays">주말·휴가 제외 실근무 <b id="svcWorkNum">0</b>일</div>

  <div class="view-tabs">

      <a class="reset-link" id="compactLink" href="?view=compact">위젯 화면</a>

  </section>

  <section id="viewCalendar" class="view">
    <p class="cal-subtitle">2026년 · 전역일 12/16(수) · 확정 46일</p>

    <div class="cal-tabs" id="calTabs"></div>

  <section id="viewCompact">

<script>
(function () {
  'use strict';

  /* =====================================================================
     0. 원본 데이터 · 공통 상수
     화면에 나오는 모든 수치는 이 블록에서 계산해서 만든다.
     요약값을 손으로 따로 적지 않는다 (CLAUDE.md L1).
     ===================================================================== */
  const YEAR = 2026;
  const MS_DAY = 86400000;
  const ENLIST = new Date(2025, 5, 17);     // 입대 2025-06-17
  const DISCHARGE = new Date(2026, 11, 16); // 전역 2026-12-16
  const FIRST_ANCHOR = new Date(2026, 7, 31); // 1회차 게이지 기준 시작점 (8/31)
  const COMBAT_TOTAL = 13;                  // 보유 전투휴무증 기본값 (사용자가 아래 combatTotal로 직접 고칠 수 있다)

  // 훈련 5개 구간 (커버 여부를 자동 집계하기 위해 구간 단위로 관리)
  const trainingBlocks = [
    ['10-19','10-20','10-21','10-22'],
    ['10-26','10-27','10-28','10-29'],
    ['11-16','11-17','11-18','11-19'],
    ['11-23','11-24','11-25','11-26'],
    ['11-30','12-1','12-2','12-3'],
  ];
  const training = new Set(trainingBlocks.flat());

  const plans = {
    confirmed: {
      label: '확정 (11+11+12+12)',
      // combatSet은 확정 일정 기준값(0장)이다. 사용자의 실제 사용 기록은
      // 아래 userCombat에 따로 쌓이며 이 값은 건드리지 않는다 (L0).
      combatSet: new Set([]),
      leaves: {
        '10-19':1,'10-20':1,'10-21':1,'10-22':1,'10-23':1,'10-24':1,'10-25':1,'10-26':1,'10-27':1,'10-28':1,'10-29':1,
        '11-2':2,'11-3':2,'11-4':2,'11-5':2,'11-6':2,'11-7':2,'11-8':2,'11-9':2,'11-10':2,'11-11':2,'11-12':2,
        '11-15':3,'11-16':3,'11-17':3,'11-18':3,'11-19':3,'11-20':3,'11-21':3,'11-22':3,'11-23':3,'11-24':3,'11-25':3,'11-26':3,
        '11-30':4,'12-1':4,'12-2':4,'12-3':4,'12-4':4,'12-5':4,'12-6':4,'12-7':4,'12-8':4,'12-9':4,'12-10':4,'12-11':4,
      },
      showMonths: [10, 11, 12],
    },
  };
  const planOrder = ['confirmed'];
  const ACTIVE_PLAN = planOrder[0];

  const DOW = '일월화수목금토';
  function monthDays(m) { return new Date(YEAR, m, 0).getDate(); }
  function monthName(m) { return m + '월'; }

  /* ---------- 날짜 유틸 ---------- */
  function zero(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function keyToDate(k) { const p = k.split('-').map(Number); return new Date(YEAR, p[0] - 1, p[1]); }
  function dayDiff(from, to) { return Math.round((zero(to) - zero(from)) / MS_DAY); }
  function fmt(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')'; }
  function today() { return zero(new Date()); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- 모션: 숫자 카운트업 ----------
     CSS만으로는 텍스트 노드 안의 숫자를 보간할 수 없어서(불투명도·위치 등만 가능)
     requestAnimationFrame으로 직접 보간한다. 화면에 최종적으로 찍히는 값은
     항상 render(to)와 동일하다 — 애니메이션은 그 값에 도달하는 과정만 꾸민다.
     최초 렌더는 0에서 시작해 올라간다(카운트업 연출), 이후 값이 바뀔 때는
     이전에 표시했던 값에서 이어서 움직인다. 같은 값으로 다시 그려질 때(예:
     1분마다 도는 D-Day 갱신에서 날짜가 안 바뀐 경우)는 애니메이션을 건너뛴다. */
  const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const _animPrev = new WeakMap();
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function animateValue(el, to, render, duration) {
    if (!el) return;
    duration = duration || 700;
    const from = _animPrev.has(el) ? _animPrev.get(el) : 0;
    _animPrev.set(el, to);
    if (REDUCE_MOTION || from === to) { el.textContent = render(to); return; }
    const start = performance.now();
    (function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const v = from + (to - from) * easeOutCubic(t);
      el.textContent = render(t < 1 ? v : to);
      if (t < 1) requestAnimationFrame(frame);
    })(start);
  }
  /* D-Day류 텍스트(D-41 / D-DAY / D+3)는 부호에 따라 형식 자체가 달라져서
     매 프레임 부호를 다시 판정하면 애니메이션 중간에 라벨이 깜빡인다.
     그래서 라벨(D-/D-DAY/D+)은 최종값 기준으로 한 번만 정하고, 숫자 크기만 센다. */
  function animateDday(el, diff, duration) {
    if (!el) return;
    if (diff === 0) { _animPrev.set(el, 0); el.textContent = 'D-DAY'; return; }
    const label = diff > 0 ? 'D-' : 'D+';
    animateValue(el, Math.abs(diff), v => label + Math.round(v), duration);
  }

  /* ---------- 회차를 leaves에서 파생 (날짜를 따로 적지 않는다) ---------- */
  function deriveRounds(planId) {
    const leaves = plans[planId].leaves;
    const byRound = new Map();
    Object.keys(leaves).forEach(k => {
      const r = leaves[k];
      if (typeof r !== 'number') return;
      if (!byRound.has(r)) byRound.set(r, []);
      byRound.get(r).push(keyToDate(k));
    });
    return Array.from(byRound.entries()).map(function (e) {
      const dates = e[1].sort((a, b) => a - b);
      const start = dates[0];
      const end = dates[dates.length - 1];
      return {
        round: e[0],
        start: start,
        end: end,
        back: new Date(end.getTime() + MS_DAY), // 복귀일 = 마지막 날 다음날
        days: dates.length,
      };
    }).sort((a, b) => a.start - b.start);
  }
  const rounds = deriveRounds(ACTIVE_PLAN);

  /* =====================================================================
     1. 저장소 — 키를 기능별로 분리해서 하나가 깨져도 나머지가 살아남게 한다
     ===================================================================== */
  const LEDGER_KEY = 'leave-ledger-v2';   // 대장 (기본값 미변경이므로 버전 유지)
  const COMBAT_KEY = 'mlv-combat-v1';         // 전투휴무증 사용 기록
  const COMBAT_TOTAL_KEY = 'mlv-combat-total-v1'; // 전투휴무증 보유 총 장수 (사용자 편집)
  const THEME_KEY  = 'mlv-theme-v1';          // 테마 선택값

  function readStore(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function writeStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      flashSaved();
    } catch (e) {
      // 저장 실패해도 메모리 상태로 계속 동작한다
    }
  }
  let savedTimer = null;
  function flashSaved() {
    const note = document.getElementById('savedNote');
    if (!note) return;
    note.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { note.textContent = ''; }, 2500);
  }

  /* =====================================================================
     2. 대장 (휴가 집계표)
     ===================================================================== */
  const DEFAULT_GROUPS = [
    { id: 'annual', title: '연가', items: [
      { id: 'g1', label: '연가', qty: 23 },
    ]},
    { id: 'reward', title: '포상', items: [
      { id: 'g2', label: '운전', qty: 4 },
      { id: 'g3', label: '뜀걸음', qty: 2 },
      { id: 'g4', label: '야근', qty: 3 },
      { id: 'g5', label: '사격특급', qty: 1 },
      { id: 'g6', label: '중대장', qty: 1 },
      { id: 'g7', label: '모범용사(앱개발)', qty: 3 },
      { id: 'g8', label: '드림', qty: 3 },
    ]},
    { id: 'comfort', title: '위로', items: [
      { id: 'g9', label: '종교', qty: 3 },
      { id: 'g10', label: '시설방문', qty: 1 },
    ]},
    { id: 'petition', title: '청원', items: [
      { id: 'g11', label: '구직', qty: 2 },
    ]},
  ];

  function loadLedger() {
    const parsed = readStore(LEDGER_KEY, null);
    if (!Array.isArray(parsed) || !parsed.length) return JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    return parsed;
  }

  let state = loadLedger();
  let uidCounter = 1000;
  function uid() { return 'u' + (uidCounter++); }

  const groupsEl = document.getElementById('groups');
  const grandTotalEl = document.getElementById('grandTotal');
  const groupTotalsEl = document.getElementById('groupTotals');
  const heroMetaEl = document.getElementById('heroMeta');
  const newGroupSel = document.getElementById('newGroup');

  function ledgerTotal() {
    return state.reduce((s, g) => s + g.items.reduce((t, it) => t + (Number(it.qty) || 0), 0), 0);
  }

  /* 달력 일정에서 오늘 기준 소진 현황을 뽑는다 (①의 근거 데이터) */
  function leaveProgress() {
    const leaves = plans[ACTIVE_PLAN].leaves;
    const t = today();
    let used = 0, upcoming = 0;
    Object.keys(leaves).forEach(function (k) {
      if (keyToDate(k) <= t) used++; else upcoming++;
    });
    return { planned: used + upcoming, used: used, upcoming: upcoming };
  }

  function renderLedger() {
    let grand = 0;
    let maxQty = 1;
    state.forEach(g => g.items.forEach(it => { if (it.qty > maxQty) maxQty = it.qty; }));

    groupsEl.innerHTML = state.map(function (g) {
      const groupTotal = g.items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
      grand += groupTotal;
      const rows = g.items.map(function (it) {
        const pct = Math.max(4, Math.round((it.qty / maxQty) * 100));
        return '' +
        '<div class="row" data-item="' + it.id + '" data-group="' + g.id + '">' +
          '<div class="row-main">' +
            '<div class="row-label">' + escapeHtml(it.label) + '</div>' +
            '<div class="row-bar-track"><div class="row-bar-fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<div class="qty">' +
            '<button data-action="dec">−</button>' +
            '<input type="number" min="0" value="' + it.qty + '" data-action="set">' +
            '<button data-action="inc">+</button>' +
          '</div>' +
          '<button class="del" data-action="del" title="삭제">✕</button>' +
        '</div>';
      }).join('');

      return '' +
      '<div class="group" data-group-id="' + g.id + '">' +
        '<div class="group-head">' +
          '<div class="group-title">' + escapeHtml(g.title) + '</div>' +
          '<div class="group-total"><b>' + groupTotal + '</b>일</div>' +
        '</div>' + rows +
      '</div>';
    }).join('');

    animateValue(grandTotalEl, grand, v => Math.round(v), 700);

    groupTotalsEl.innerHTML = state.map(function (g) {
      const t = g.items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
      return '<div class="hero-stat"><div class="n">' + t + '</div><div class="l">' + escapeHtml(g.title) + '</div></div>';
    }).join('');

    // ① 대장 ↔ 달력 연동: 사용/잔여를 leaves 원본에서 계산
    const p = leaveProgress();
    const left = grand - p.used;
    let meta = '보유 <b>' + grand + '일</b> · 사용 <b>' + p.used + '일</b> · 잔여 <b>' + left + '일</b>';
    if (grand !== p.planned) {
      // 어느 쪽도 자동으로 고치지 않는다. 어긋난 사실만 표시한다 (L0)
      const gap = Math.abs(grand - p.planned);
      meta += ' <span class="warn-badge">달력 배정 ' + p.planned + '일과 ' + gap + '일 차이</span>';
    }
    heroMetaEl.innerHTML = meta;

    newGroupSel.innerHTML = state.map(g => '<option value="' + g.id + '">' + escapeHtml(g.title) + '</option>').join('');
  }

  groupsEl.addEventListener('click', function (e) {
    const row = e.target.closest('.row');
    if (!row) return;
    const group = state.find(g => g.id === row.dataset.group);
    if (!group) return;
    const item = group.items.find(i => i.id === row.dataset.item);
    if (!item) return;

    const action = e.target.dataset.action;
    if (action === 'inc') {
      item.qty = (Number(item.qty) || 0) + 1;
    } else if (action === 'dec') {
      item.qty = Math.max(0, (Number(item.qty) || 0) - 1);
    } else if (action === 'del') {
      group.items = group.items.filter(i => i.id !== row.dataset.item);
    } else {
      return;
    }
    writeStore(LEDGER_KEY, state);
    renderLedger();
  });

  groupsEl.addEventListener('change', function (e) {
    if (e.target.dataset.action !== 'set') return;
    const row = e.target.closest('.row');
    const group = state.find(g => g.id === row.dataset.group);
    const item = group && group.items.find(i => i.id === row.dataset.item);
    if (!item) return;
    let v = parseInt(e.target.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    item.qty = v;
    writeStore(LEDGER_KEY, state);
    renderLedger();
  });

  document.getElementById('addBtn').addEventListener('click', function () {
    const labelEl = document.getElementById('newLabel');
    const qtyEl = document.getElementById('newQty');
    const label = labelEl.value.trim();
    const qty = Math.max(0, parseInt(qtyEl.value, 10) || 0);
    if (!label) { labelEl.focus(); return; }
    const group = state.find(g => g.id === newGroupSel.value);
    if (!group) return;
    group.items.push({ id: uid(), label: label, qty: qty });
    labelEl.value = '';
    qtyEl.value = 1;
    writeStore(LEDGER_KEY, state);
    renderLedger();
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    state = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
    uidCounter = 1000;
    writeStore(LEDGER_KEY, state);
    renderLedger();
  });

  /* =====================================================================
     3. 전투휴무증 — 확정 데이터(combatSet)는 두고 사용 기록만 따로 쌓는다
     ===================================================================== */
  let userCombat = new Set((function () {
    const v = readStore(COMBAT_KEY, []);
    return Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
  })());
  let recordMode = false;
  // 보유 총 장수는 대장 항목들처럼 직접 편집 가능한 값이다 — 잔여는 항상
  // 이 값에서 자동 계산되고(L1), 이 숫자 자체를 손으로 덮어쓰지는 않는다.
  let combatTotal = (function () {
    const v = readStore(COMBAT_TOTAL_KEY, COMBAT_TOTAL);
    const n = Number(v);
    return Number.isFinite(n) && n >= 0 ? n : COMBAT_TOTAL;
  })();
  function saveCombatTotal() {
    writeStore(COMBAT_TOTAL_KEY, combatTotal);
  }

  function combatUsedSet() {
    const s = new Set(plans[ACTIVE_PLAN].combatSet);
    userCombat.forEach(k => s.add(k));
    return s;
  }
  function saveCombat() {
    writeStore(COMBAT_KEY, Array.from(userCombat));
  }
  function toggleCombat(key) {
    if (userCombat.has(key)) {
      userCombat.delete(key);
    } else {
      if (combatUsedSet().size >= combatTotal) {
        alert('전투휴무증은 ' + combatTotal + '장까지입니다. 보유 장수를 늘리거나 기존 기록을 지운 뒤 추가하세요.');
        return;
      }
      userCombat.add(key);
    }
    saveCombat();
    renderCalendar();
    updateDday(); // 전투휴무 예정일이 남은 근무일 계산에 들어가므로 같이 갱신한다
  }

  function renderCombatCard() {
    const used = combatUsedSet();
    const left = combatTotal - used.size; // 음수가 될 수 있다(기록이 보유 장수보다 많을 때) — 그대로 보여준다, 감추지 않는다
    const pct = combatTotal > 0 ? Math.max(0, Math.min(100, Math.round((used.size / combatTotal) * 100))) : 100;
    const sorted = Array.from(used).sort((a, b) => keyToDate(a) - keyToDate(b));

    const chips = sorted.length
      ? sorted.map(function (k) {
          const removable = userCombat.has(k);
          return '<span class="chip">' + escapeHtml(fmt(keyToDate(k))) +
            (removable ? '<button data-remove="' + k + '" title="기록 삭제">✕</button>' : '') +
          '</span>';
        }).join('')
      : '<span class="combat-note" style="margin:0">아직 기록된 사용일이 없습니다.</span>';

    document.getElementById('combatCard').innerHTML = '' +
      '<div class="combat-card">' +
        '<div class="combat-head">' +
          '<div class="combat-title">전투휴무증</div>' +
          '<div class="combat-count">잔여 <b id="combatLeftNum">0</b>장 / ' +
            '<span class="combat-total-edit">' +
              '<button data-total="dec" title="보유 장수 줄이기">−</button>' +
              '<input type="number" id="combatTotalInput" min="0" value="' + combatTotal + '">' +
              '<button data-total="inc" title="보유 장수 늘리기">+</button>' +
            '</span>장' +
          '</div>' +
        '</div>' +
        '<div class="dday-gauge-track"><div class="dday-gauge-fill" style="width:' + pct + '%"></div></div>' +
        '<p class="combat-note">보유 장수는 위 숫자를 직접 편집할 수 있습니다. 확정 일정은 전투휴무증 0장 기준이고,' +
          ' 실제로 쓴 날을 달력에 기록하면 잔여 장수가 자동으로 줄어듭니다.' +
          (recordMode ? ' <b>달력에서 날짜를 눌러 기록하세요.</b>' : '') + '</p>' +
        '<button class="btn-outline' + (recordMode ? ' on' : '') + '" id="recordBtn">' +
          (recordMode ? '기록 모드 끄기' : '기록 모드 켜기') + '</button>' +
        '<div class="combat-chips" style="margin-top:12px">' + chips + '</div>' +
      '</div>';

    animateValue(document.getElementById('combatLeftNum'), left, v => Math.round(v), 700);

    document.getElementById('recordBtn').addEventListener('click', function () {
      recordMode = !recordMode;
      document.body.classList.toggle('record-mode', recordMode);
      renderCalendar();
    });
    document.querySelectorAll('#combatCard [data-total]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        combatTotal = Math.max(0, combatTotal + (btn.dataset.total === 'inc' ? 1 : -1));
        saveCombatTotal();
        renderCalendar();
      });
    });
    document.getElementById('combatTotalInput').addEventListener('change', function (e) {
      let v = parseInt(e.target.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      combatTotal = v;
      saveCombatTotal();
      renderCalendar();
    });
    document.querySelectorAll('#combatCard [data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () { toggleCombat(btn.dataset.remove); });
    });
  }

  /* =====================================================================
     4. 달력
     ===================================================================== */
  /* 표시할 달 = 일정이 있는 달 + 오늘이 속한 달.
     오늘이 일정 범위 밖(예: 9월)이어도 "오늘"과 전투휴무증 기록이 화면에 보이게 한다. */
  function displayMonths(plan) {
    const months = new Set(plan.showMonths);
    const t = today();
    if (t.getFullYear() === YEAR) months.add(t.getMonth() + 1);
    return Array.from(months).sort((a, b) => a - b);
  }

  function buildPlanHtml(planId) {
    const plan = plans[planId];
    const leaves = plan.leaves;
    const t = today();
    const combatUsed = combatUsedSet();

    // 요약 4개 — 전부 원본 데이터에서 계산 (L1)
    const totalDays = Object.keys(leaves).length;
    const roundCount = deriveRounds(planId).length;
    const coveredCount = trainingBlocks.filter(b => b.every(d => leaves[d])).length;

    let html = '<div class="cal-summary">' +
      '<div class="cal-stat"><div class="cal-stat-num">' + totalDays + '일</div><div class="cal-stat-label">총 소진</div></div>' +
      '<div class="cal-stat"><div class="cal-stat-num">' + roundCount + '회차</div><div class="cal-stat-label">휴가 횟수</div></div>' +
      '<div class="cal-stat"><div class="cal-stat-num">' + combatUsed.size + '장</div><div class="cal-stat-label">전투휴무증 (잔여 ' + (combatTotal - combatUsed.size) + ')</div></div>' +
      '<div class="cal-stat"><div class="cal-stat-num">' + coveredCount + '/' + trainingBlocks.length + '</div><div class="cal-stat-label">훈련커버</div></div>' +
    '</div>';

    html += '<div class="cal-months">';
    displayMonths(plan).forEach(function (m) {
      const days = monthDays(m);
      html += '<div class="cal-month"><div class="cal-month-title">' + monthName(m) + ' ' + YEAR + '</div>' +
        '<div class="cal-days-header">' +
          '<span class="cal-d-sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>' +
        '</div><div class="cal-days-grid">';
      const firstDay = new Date(YEAR, m - 1, 1).getDay();
      for (let i = 0; i < firstDay; i++) html += '<div class="cal-day"></div>';
      for (let d = 1; d <= days; d++) {
        const key = m + '-' + d;
        const date = new Date(YEAR, m - 1, d);
        const dow = date.getDay();
        const round = leaves[key];
        const isCombat = combatUsed.has(key);
        const isTrain = training.has(key);
        const isDischarge = key === '12-16';
        let style = '';
        let cls = 'cal-day can-record';

        if (isDischarge) {
          style = 'background:var(--accent);color:var(--color-ivory-light);font-weight:700';
        } else if (isCombat) {
          style = 'background:var(--color-slate-dark);color:var(--color-ivory-light);font-weight:600';
        } else if (typeof round === 'number') {
          style = 'background:var(--round-' + round + '-bg);color:var(--round-' + round + '-fg);font-weight:600';
        } else if (isTrain) {
          style = 'background:var(--panel);color:var(--muted-strong);font-weight:600';
        } else if (dow === 0) { cls += ' cal-d-sun';
        } else if (dow === 6) { cls += ' cal-d-sat'; }

        // ③ 오늘 / 지나간 날
        if (date < t) cls += ' is-past';
        else if (date.getTime() === t.getTime()) cls += ' is-today';

        html += '<div class="' + cls + '" data-key="' + key + '" style="' + style + '">' + d + '</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';

    // 일정 목록도 leaves에서 파생시킨 회차 정보로 그린다 (L1)
    html += '<div class="cal-schedule"><div class="cal-schedule-title">일정</div>' +
      deriveRounds(planId).map(function (r) {
        const done = t > r.end;
        const now = t >= r.start && t <= r.end;
        return '<div class="cal-schedule-item' + (done ? ' is-done' : '') + '">' +
          '<span class="cal-badge" style="background:var(--round-' + r.round + '-bg);color:var(--round-' + r.round + '-fg)">' + r.round + '회차</span>' +
          '<span>' + fmt(r.start) + '~' + fmt(r.end) + ' — ' + r.days + '일</span>' +
          (now ? '<span class="now-tag">휴가 중</span>' : (done ? '<span class="now-tag" style="color:var(--muted)">종료</span>' : '')) +
        '</div>';
      }).join('') + '</div>';

    return html;
  }

  function renderCalendar() {
    const host = document.getElementById('calPlans');
    host.innerHTML = planOrder.map(function (id) {
      return '<div class="cal-plan" id="' + id + '">' + buildPlanHtml(id) + '</div>';
    }).join('');
    // 동적으로 그린 카드에는 초기 활성 상태를 코드로 직접 붙인다 (L1)
    const first = document.getElementById(planOrder[0]);
    if (first) first.classList.add('active');
    renderCombatCard();
  }

  document.getElementById('calPlans').addEventListener('click', function (e) {
    if (!recordMode) return;
    const cell = e.target.closest('.cal-day[data-key]');
    if (!cell) return;
    toggleCombat(cell.dataset.key);
  });

  const tabsEl = document.getElementById('calTabs');
  if (planOrder.length <= 1) {
    tabsEl.style.display = 'none';
  } else {
    tabsEl.innerHTML = planOrder.map(function (id, i) {
      return '<button class="cal-tab' + (i === 0 ? ' active' : '') + '" data-plan="' + id + '">' +
        plans[id].label.replace(' (', '<br><small>(').replace(/\)$/, ')</small>') + '</button>';
    }).join('');
    tabsEl.addEventListener('click', function (e) {
      const btn = e.target.closest('.cal-tab');
      if (!btn) return;
      document.querySelectorAll('.cal-plan').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.cal-tab').forEach(x => x.classList.remove('active'));
      document.getElementById(btn.dataset.plan).classList.add('active');
      btn.classList.add('active');
    });
  }

  /* =====================================================================
     5. D-Day — 회차 날짜를 하드코딩하지 않고 leaves에서 파생해 자동 전환
     ===================================================================== */
  function ddayState() {
    const t = today();
    for (let i = 0; i < rounds.length; i++) {
      const r = rounds[i];
      if (t < r.start) {
        const from = i === 0 ? FIRST_ANCHOR : rounds[i - 1].back;
        return { kind: 'before', label: r.round + '회차 휴가까지', target: r.start, from: from, round: r };
      }
      if (t <= r.end) {
        return { kind: 'during', label: r.round + '회차 복귀까지', target: r.back, from: r.start, round: r };
      }
    }
    const from = rounds.length ? rounds[rounds.length - 1].back : FIRST_ANCHOR;
    return { kind: 'after', label: '전역까지', target: DISCHARGE, from: from, round: null };
  }

  function gauge(from, target) {
    const t = today();
    const span = dayDiff(from, target);
    const done = Math.min(span, Math.max(0, dayDiff(from, t)));
    return span > 0 ? Math.min(100, Math.max(0, (done / span) * 100)) : 100;
  }

  function ddayText(n) {
    return n > 0 ? 'D-' + n : (n === 0 ? 'D-DAY' : 'D+' + (-n));
  }

  /* 남은 근무일 = [from, to) 구간에서 주말 · 확정 4회차 휴가 · 전투휴무 예정일을
     뺀 날수. today를 포함하고 목표일(to) 당일은 도달 시점이라 제외한다.
     세 가지 제외 조건 전부 leaves/combatUsedSet 원본에서 그때그때 판정한다(L1) —
     "근무일 며칠"을 따로 세어서 하드코딩하지 않는다. */
  function countWorkdays(from, to) {
    const leaves = plans[ACTIVE_PLAN].leaves;
    const combatOff = combatUsedSet();
    let count = 0;
    let d = zero(from);
    const end = zero(to);
    while (d < end) {
      const key = (d.getMonth() + 1) + '-' + d.getDate();
      const dow = d.getDay();
      const isWeekend = dow === 0 || dow === 6;
      const isLeave = !!leaves[key];
      const isCombatOff = combatOff.has(key);
      if (!isWeekend && !isLeave && !isCombatOff) count++;
      d = new Date(d.getTime() + MS_DAY);
    }
    return count;
  }

  function updateDday() {
    const t = today();
    const s = ddayState();
    const diff = dayDiff(t, s.target);
    const pct = gauge(s.from, s.target);

    document.getElementById('ddayLabel').textContent = s.label;
    const ddayNumEl = document.getElementById('ddayNum');
    animateDday(ddayNumEl, diff);
    document.getElementById('ddayFill').style.width = pct + '%';
    // D-Day 당일 하루만 카드/숫자에 은은한 글로우를 준다 (휴가 시작·복귀·전역 전부 해당)
    ddayNumEl.classList.toggle('is-dday-today', diff === 0);
    document.getElementById('ddayCard').classList.toggle('is-dday-today', diff === 0);

    let caption;
    if (s.kind === 'during') {
      const spent = dayDiff(s.round.start, t) + 1;
      caption = fmt(s.round.start) + '~' + fmt(s.round.end) + ' · ' + spent + '/' + s.round.days + '일째 · ' +
        fmt(s.round.back) + ' 복귀';
    } else if (s.kind === 'before') {
      caption = fmt(s.from) + '부터 ' + dayDiff(s.from, t) + '일 경과 · ' + Math.round(pct) + '% · ' +
        fmt(s.target) + ' 시작';
    } else {
      caption = '휴가 일정 종료 · ' + fmt(DISCHARGE) + ' 전역';
    }
    document.getElementById('ddayCaption').textContent = caption;
    animateValue(document.getElementById('ddayWorkNum'), countWorkdays(t, s.target), v => Math.round(v), 700);

    // 전역(복무) 게이지 — 입대 2025/6/17 ~ 전역 2026/12/16
    const svcTotal = dayDiff(ENLIST, DISCHARGE);
    const svcDone = Math.min(svcTotal, Math.max(0, dayDiff(ENLIST, t)));
    const svcPct = svcTotal > 0 ? (svcDone / svcTotal) * 100 : 100;
    const svcDiff = dayDiff(t, DISCHARGE);
    const svcNumEl = document.getElementById('svcNum');
    animateDday(svcNumEl, svcDiff);
    document.getElementById('svcFill').style.width = svcPct + '%';
    svcNumEl.classList.toggle('is-dday-today', svcDiff === 0);
    document.getElementById('serviceCard').classList.toggle('is-dday-today', svcDiff === 0);
    document.getElementById('svcCaption').textContent =
      '복무 ' + (svcDone + 1) + '일차 / 총 ' + (svcTotal + 1) + '일 · ' + svcPct.toFixed(1) + '%' +
      ' · 입대 ' + fmt(ENLIST);
    animateValue(document.getElementById('svcWorkNum'), countWorkdays(t, DISCHARGE), v => Math.round(v), 700);

    updateCompact(s, t, diff, pct, caption, svcDiff, svcPct, svcDone, svcTotal);
  }

  /* ---------- 위젯(컴팩트) 화면 ---------- */
  function nextLine(s) {
    // 휴가가 다 끝난 뒤에는 윗줄(sub)이 이미 전역일을 말하므로, 큰 숫자가 전역이 아닌 한 비운다
    if (s.kind === 'during') {
      const i = rounds.findIndex(r => r.round === s.round.round);
      const nx = rounds[i + 1];
      // 복귀일은 바로 윗줄(sub)에 이미 있으므로 여기서는 그 다음 일정만 말한다
      return nx
        ? '다음 ' + nx.round + '회차 ' + fmt(nx.start) + '~' + fmt(nx.end) + ' · ' + nx.days + '일'
        : '전역 ' + fmt(DISCHARGE);
    }
    if (s.kind === 'before') {
      return '다음 ' + s.round.round + '회차 ' + fmt(s.round.start) + '~' + fmt(s.round.end) +
        ' · ' + s.round.days + '일';
    }
    return FOCUS === 'discharge' ? '전역 ' + fmt(DISCHARGE) : '';
  }

  function updateCompact(s, t, diff, pct, caption, svcDiff, svcPct, svcDone, svcTotal) {
    const p = leaveProgress();
    const left = ledgerTotal() - p.used;
    const doneRounds = rounds.filter(r => t > r.end).length;

    // 상태별 색 반전: 휴가 중이 전역 임박보다 우선
    const card = document.getElementById('cpCard');
    card.classList.remove('st-during', 'st-final');
    let tag = '';
    if (s.kind === 'during') { card.classList.add('st-during'); tag = '휴가 중'; }
    else if (svcDiff <= 7) { card.classList.add('st-final'); tag = '전역 임박'; }
    const tagEl = document.getElementById('cpTag');
    tagEl.textContent = tag;
    tagEl.hidden = !tag;

    // 4회차 진행 세그먼트 — 폭은 회차 일수, 채움은 경과 일수 (전부 leaves 파생)
    document.getElementById('cpSegs').innerHTML = rounds.map(function (r) {
      const spent = Math.min(r.days, Math.max(0, dayDiff(r.start, t) + 1));
      return '<div class="seg" style="flex-grow:' + r.days + '">' +
        '<i style="width:' + ((spent / r.days) * 100) + '%"></i></div>';
    }).join('');
    document.getElementById('cpSegLabels').innerHTML = rounds.map(function (r) {
      const on = s.round && s.round.round === r.round;
      return '<div class="seg-label' + (on ? ' on' : '') + '" style="flex-grow:' + r.days + '">' +
        r.round + '</div>';
    }).join('');

    // 큰 숫자를 무엇으로 볼지는 ?focus= 로 고른다
    const cpNumEl = document.getElementById('cpNum');
    let label, numDiff, fill, sub, cell1Days, cell2, cell2Label, cell3, cell3Label;
    if (FOCUS === 'discharge') {
      label = '전역까지';
      numDiff = svcDiff;
      fill = svcPct;
      sub = '복무 ' + (svcDone + 1) + '일차 / 총 ' + (svcTotal + 1) + '일 · ' + svcPct.toFixed(1) + '%';
      cell1Days = left;
      cell2 = diff; cell2Label = s.kind === 'during' ? '복귀' : '다음 휴가'; // D-Day류라 카운트업
      cell3 = doneRounds + '/' + rounds.length; cell3Label = '회차 종료'; // 분수는 그대로 표시(카운트업 대상 아님)
    } else {
      label = s.label;
      numDiff = diff;
      fill = pct;
      sub = caption;
      cell1Days = left;
      cell2 = svcDiff; cell2Label = '전역';
      cell3 = Math.round(svcPct); cell3Label = '복무 진행';
    }

    document.getElementById('cpLabel').textContent = label;
    animateDday(cpNumEl, numDiff);
    cpNumEl.classList.toggle('is-dday-today', numDiff === 0);
    document.getElementById('cpCard').classList.toggle('is-dday-today', numDiff === 0);
    document.getElementById('cpFill').style.width = fill + '%';
    document.getElementById('cpSub').textContent = sub;
    document.getElementById('cpNext').textContent = nextLine(s);

    animateValue(document.getElementById('cpC1'), cell1Days, v => Math.round(v) + '일', 700);
    document.getElementById('cpL1').textContent = '잔여 휴가';
    animateDday(document.getElementById('cpC2'), cell2, 700);
    document.getElementById('cpL2').textContent = cell2Label;
    if (FOCUS === 'discharge') {
      document.getElementById('cpC3').textContent = cell3; // 분수 표시는 즉시
    } else {
      animateValue(document.getElementById('cpC3'), cell3, v => Math.round(v) + '%', 700);
    }
    document.getElementById('cpL3').textContent = cell3Label;
  }

  /* =====================================================================
     6. 뷰 전환 · 테마 · 홈 화면 추가
     ===================================================================== */
  function showView(name) {
    document.getElementById('viewLedger').classList.toggle('active', name === 'ledger');
    document.getElementById('viewCalendar').classList.toggle('active', name === 'calendar');
    document.getElementById('tabLedger').classList.toggle('active', name === 'ledger');
    document.getElementById('tabCalendar').classList.toggle('active', name === 'calendar');
  }
  document.querySelector('.view-tabs').addEventListener('click', function (e) {
    const btn = e.target.closest('.view-tab');
    if (btn) showView(btn.dataset.view);
  });

  /* ?theme= 로 강제된 테마는 위젯용이므로 저장값보다 우선한다 */
  const THEME_PARAM = new URLSearchParams(location.search).get('theme');

  const THEMES = [
    { id: 'system', label: '시스템' },
    { id: 'light', label: '밝게' },
    { id: 'dark', label: '어둡게' },
  ];
  let themeId = readStore(THEME_KEY, 'system');
  if (!THEMES.some(x => x.id === themeId)) themeId = 'system';

  function applyTheme() {
    const effective = (THEME_PARAM === 'dark' || THEME_PARAM === 'light') ? THEME_PARAM : themeId;
    if (effective === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', effective);
    const cur = THEMES.find(x => x.id === themeId);
    document.getElementById('themeBtn').textContent = '테마: ' + cur.label;
  }
  document.getElementById('themeBtn').addEventListener('click', function () {
    const i = THEMES.findIndex(x => x.id === themeId);
    themeId = THEMES[(i + 1) % THEMES.length].id;
    writeStore(THEME_KEY, themeId);
    applyTheme();
  });

  // 홈 화면 추가용 manifest — 단일 파일 규약을 지키려고 런타임에 blob으로 만든다.
  // (data: URI manifest는 start_url이 동일 출처가 아니라서 무시된다)
  function injectManifest() {
    if (!/^https?:$/.test(location.protocol)) return; // file:// 에서는 apple-touch-icon으로 충분
    try {
      const icon = document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
      // 홈 화면에 추가하면 브라우저는 현재 주소가 아니라 manifest의 start_url로 연다.
      // 파라미터를 빼면 위젯 주소로 추가해도 전체 화면이 열리므로 검색문자열까지 넣는다.
      const attr = document.documentElement.getAttribute('data-theme');
      const dark = attr === 'dark' ||
        (!attr && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const bg = dark ? '#141413' : '#f0eee6';
      // 휴가용·전역용을 각각 홈 화면에 두면 이름이 같아 구분이 안 되므로 갈라준다
      const named = FOCUS === 'discharge'
        ? { name: '전역 D-Day', short_name: '전역' }
        : { name: '말년휴가 대장', short_name: '말년휴가' };
      const manifest = {
        name: named.name,
        short_name: named.short_name,
        start_url: location.pathname + location.search,
        scope: location.pathname,
        display: 'standalone',
        background_color: bg,
        theme_color: bg,
        icons: [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' }],
      };
      const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    } catch (e) {}
  }

  /* =====================================================================
     7. 시작
     ===================================================================== */
  const PARAMS = new URLSearchParams(location.search);
  const FOCUS = PARAMS.get('focus') === 'discharge' ? 'discharge' : 'leave';
  if (PARAMS.get('view') === 'compact') {
    document.body.classList.add('compact-mode');
    if (PARAMS.get('bare') === '1') document.body.classList.add('bare-mode');
  }
  applyTheme();
  renderLedger();
  renderCalendar();
  updateDday();
  injectManifest();
  setInterval(updateDday, 60 * 1000);
})();
</script>
</body>
